<svg width="920" height="360" viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="@keelstack/guard action firewall demo">
  <style>
    .bg{fill:#0d1117}.bar{fill:#161b22}.muted{fill:#8b949e}.text{fill:#e6edf3}.green{fill:#3fb950}.amber{fill:#d29922}.red{fill:#f85149}.blue{fill:#58a6ff}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.small{font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font:600 15px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .a1{opacity:0;animation:show .15s .4s forwards}.a2{opacity:0;animation:show .15s 1.0s forwards}.a3{opacity:0;animation:show .15s 1.6s forwards}.a4{opacity:0;animation:show .15s 2.2s forwards}.a5{opacity:0;animation:show .15s 2.8s forwards}.a6{opacity:0;animation:show .15s 3.4s forwards}
    @keyframes show{to{opacity:1}}
  </style>
  <rect class="bg" width="920" height="360" rx="12"/>
  <rect class="bar" width="920" height="42" rx="12"/>
  <rect class="bar" y="30" width="920" height="12"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/><circle cx="42" cy="21" r="6" fill="#ffbd2e"/><circle cx="62" cy="21" r="6" fill="#27c93f"/>
  <text x="460" y="27" text-anchor="middle" class="muted title">@keelstack/guard — agent action firewall</text>

  <g class="a1">
    <text x="28" y="78" class="muted mono">agent proposes</text>
    <text x="160" y="78" class="blue mono">refund_payment</text>
    <text x="300" y="78" class="text mono">{ paymentId: "pay_42", amountUsd: 180 }</text>
  </g>

  <g class="a2">
    <text x="28" y="122" class="muted mono">intent</text>
    <text x="98" y="122" class="text mono">sha256:7d8b…</text>
    <text x="232" y="122" class="green mono">✓ exact-call binding</text>
  </g>

  <g class="a3">
    <text x="28" y="166" class="muted mono">approval</text>
    <text x="112" y="166" class="amber mono">pending</text>
    <text x="190" y="166" class="text mono">amount ≥ $100 → side effect has NOT executed</text>
  </g>

  <g class="a4">
    <text x="28" y="210" class="muted mono">resume</text>
    <text x="98" y="210" class="green mono">approved</text>
    <text x="188" y="210" class="text mono">intentHash = sha256:7d8b…</text>
  </g>

  <g class="a5">
    <text x="28" y="254" class="muted mono">authority</text>
    <text x="122" y="254" class="green mono">✓</text>
    <text x="146" y="254" class="text mono">$180 / $500 window · 4 / 20 executions</text>
  </g>

  <g class="a6">
    <text x="28" y="302" class="muted mono">result</text>
    <rect x="92" y="283" width="108" height="28" rx="6" fill="#16351f"/>
    <text x="107" y="302" class="green small">EXECUTED</text>
    <text x="220" y="302" class="muted mono">receipt → audit log</text>

    <text x="28" y="334" class="muted small">same key + changed amount?</text>
    <rect x="220" y="316" width="210" height="25" rx="6" fill="#3d1d20"/>
    <text x="232" y="333" class="red small">BLOCKED: INTENT CONFLICT</text>
  </g>
</svg>
